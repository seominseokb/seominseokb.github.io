title: 서민석의 블로그 # name of the site
author: 서민석 # name of site's author
lang: ko-KR
email: seominseokb@gmail.com # email of site's author
url: https://seominseokb.github.io # root address of the site
baseurl: "" # user site is served from the root path
description: > # description of the site (multiple lines allowed)
  다양한 것들을 기록합니다.

permalink: /:slug.html

favicon: "favicon.ico" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

# Replace with your GA4 Measurement ID (for example, G-XXXXXXXXXX).
google_analytics: "G-H2943E5J28"

utterances:
  repo: seominseokb/comments
  issue_term: pathname
  theme: github-light

remote_theme: riggraz/no-style-please # if you are using GitHub Pages, change it to remote_theme: riggraz/no-style-please

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: true # show titles in lowercase in lists

sass:
  style: compressed

exclude:
  - vendor
  - .jektex-cache

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jektex

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]
